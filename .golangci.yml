version: "2"
run:
  tests: false
linters:
  enable:
    - revive
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - '*'
        path: pkg/mod
    paths:
      - pkg/mod
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - pkg/mod
      - third_party$
      - builtin$
      - examples$
